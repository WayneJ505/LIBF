seed: 42
train_dataset:
  dataset:
    name: bathy-tile
    args:
      index_file: index/bathy_train.txt
      repeat: 10
  wrapper:
    name: bathy-mixed
    args:
      inp_size: 48
      scale_min: 2
      scale_max: 4
      sample_q: 2304
      hr_ratio: 1.0
  batch_size: 16
  num_workers: 48
val_dataset:
  dataset:
    name: bathy-tile
    args:
      index_file: index/bathy_val.txt
      repeat: 1
  wrapper:
    name: bathy-mixed
    args:
      inp_size: 48
      scale_min: 2
      scale_max: 4
      sample_q: 2304
      hr_ratio: 1.0
  batch_size: 16
  num_workers: 16
data_norm:
  inp:
    sub:
    - 0
    div:
    - 1
  gt:
    sub:
    - 0
    div:
    - 1
model:
  name: liif
  args:
    encoder_spec:
      name: rdn
      args:
        no_upsampling: true
        n_colors: 1
    imnet_spec:
      name: mlp
      args:
        out_dim: 1
        hidden_list:
        - 256
        - 256
        - 256
        - 256
    local_ensemble: true
    feat_unfold: true
    cell_decode: true
optimizer:
  name: adam
  args:
    lr: 0.0001
epoch_max: 500
epoch_val: 1
epoch_save: 100
loss: l1
patience_lr: 18
patience_es: 40
